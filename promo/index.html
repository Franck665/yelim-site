<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code promo Yélim</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f5f7;
            --ink: #0d1117;
            --muted: #667085;
            --panel: #ffffff;
            --line: #d9dee7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        main {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(460px, 100%);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 24px;
            background: var(--panel);
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0;
            font-size: 34px;
            line-height: 1;
            letter-spacing: 0;
        }

        p {
            margin: 10px 0 0;
            color: var(--muted);
            line-height: 1.45;
        }

        .code {
            margin: 22px 0;
            border: 1px dashed #050505;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            font-size: 28px;
            font-weight: 850;
            letter-spacing: 0;
            background: #fafafa;
        }

        .btn {
            border: 1px solid #050505;
            border-radius: 10px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            background: #050505;
            font-weight: 780;
        }

        @media (prefers-color-scheme: dark) {
            body { background: var(--bg); color: var(--ink); }
        }
    </style>
</head>

<body>
    <main>
        <section class="card">
            <h1>Ton offre Yélim est prête.</h1>
            <p>Installe l'app, ajoute ton code à la commande et profite de l'offre.</p>
            <div class="code" data-campaign-code>CODE</div>
            <a class="btn" href="#" data-store="auto">Télécharger Yélim</a>
        </section>
    </main>

    <script type="module">
        import { bindStoreButtons, populateCampaignText, trackCampaignClick } from "../assets/campaign-tracking.js";

        populateCampaignText();
        bindStoreButtons();
        trackCampaignClick("promo_page_view");
    </script>
</body>

</html>
