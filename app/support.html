<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Client - Yélim</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f9f9f9;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            color: #000;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .contact-info {
            margin-top: 40px;
            padding: 20px;
            background: #f0f7ff;
            border-radius: 12px;
            display: inline-block;
            text-align: left;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .contact-item i {
            font-size: 1.5em;
            color: #007AFF;
        }

        a {
            color: #007AFF;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 24px;
            background: #000;
            color: #fff;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">


        <h1>Support Yélim</h1>
        <p>Une question ? Un problème avec une commande ? Notre équipe est là pour vous aider.</p>

        <div class="contact-info">
            <div class="contact-item">
                <span>📧 E-mail : <a href="mailto:support@yelim-solutions.com">support@yelim-solutions.com</a></span>
            </div>
            <div class="contact-item">
                <span>📍 Adresse : Ouagadougou, Burkina Faso</span>
            </div>
        </div>

        <div>
            <a href="/" class="back-home">Retour à l'accueil</a>
        </div>
    </div>
</body>

</html>
