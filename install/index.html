<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Télécharger Yélim</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: #007AFF;
            border-radius: 22px;
            margin-bottom: 1.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        p {
            color: #65676b;
            margin-bottom: 2rem;
        }

        .btn {
            display: block;
            background: #007AFF;
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: bold;
            margin-bottom: 1rem;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }
    </style>
    <script>
        function redirect() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var iosLink = "https://apps.apple.com/app/id6758163762"; // ID mis à jour
            var androidLink = "https://play.google.com/store/apps/details?id=com.s1.yelim"; // À mettre à jour

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = iosLink;
            } else if (/android/i.test(userAgent)) {
                window.location.href = androidLink;
            }
        }
        window.onload = redirect;
    </script>
</head>

<body>
    <div class="card">
        <div class="logo">Y</div>
        <h1>Yélim</h1>
        <p>Redirection vers le store en cours...</p>
        <a href="https://apps.apple.com/app/id6758163762" class="btn" id="ios-btn">App Store (iOS)</a>
        <a href="https://play.google.com/store/apps/details?id=com.s1.yelim" class="btn" id="android-btn">Play Store
            (Android)</a>
    </div>
</body>

</html>
